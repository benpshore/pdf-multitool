name: Source and verifier checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      # Runner/action provisioning is not an upstream engine provenance attestation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Python syntax and fail-closed verifier tests
        run: |
          uv run --no-project --python 3.14 python -m compileall -q src/pdf_multitool tests scripts
          uv run --no-project --python 3.14 python scripts/verify_pypi_artifact_tests.py
      - name: JavaScript syntax and mocked DOM checks
        run: |
          node --check src/pdf_multitool/static/app.js
          node scripts/test_ui_dom.cjs
          node scripts/test_ui_reload.cjs
          node scripts/test_ui_archives.cjs
          node scripts/test_ui_recovery.cjs
          node scripts/test_ui_recovery.cjs --missing-source
          node scripts/test_ui_recovery.cjs --legacy-bundle
      - name: State integration gate
        run: |
          echo 'Native-engine integration CI requires the verified pinned engine environment.'
          echo 'This source-only workflow is not full product acceptance.'

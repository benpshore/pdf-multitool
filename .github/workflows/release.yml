name: Release

# Publish: push a tag, e.g. `git tag v0.1.1 && git push --tags`.
# Every merge to main is also released automatically by auto-release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag matches computed project version
        run: test "$(uvx uv-dynamic-versioning)" = "${GITHUB_REF_NAME#v}"
      - uses: ./.github/actions/python-validation
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Pack the release tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*

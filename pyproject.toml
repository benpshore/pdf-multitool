[project]
name = "pdf-multitool"
dynamic = ["version"]
description = "Local PDF workbench with a browser UI and scriptable CLI"
readme = "README.md"
authors = [{ name = "Ben Shore" }]
requires-python = ">=3.14"
dependencies = [
    "pdfplumber==0.11.10",
    "pikepdf==10.17.0",
    "pymupdf==1.26.7",
]

[project.optional-dependencies]
images = ["Pillow==12.3.0"]
html = ["weasyprint==70.0"]
ocr = ["docling[easyocr]==2.138.0"]

[project.scripts]
pdf-multitool = "pdf_multitool.cli:main"

# The version is the git tag (v1.2.3 -> 1.2.3); nothing to bump by hand.
[build-system]
requires = ["hatchling>=1.32,<2", "uv-dynamic-versioning>=0.14,<1"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_multitool"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pytest>=8",
    "reportlab>=4.4,<5",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Preserve the premeasurement generator bytes; four frozen description strings are long.
"experiments/row_order_contract_v1/build_fixtures.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
